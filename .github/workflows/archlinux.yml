name: Arch Linux package

# Manual test builds only. See docs/packaging.md for the requirements and the
# developer test plan. Tag-triggered release upload is a later change.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # archlinux/archlinux:base-devel, digest pulled 2026-10-29. The image is
  # rolling; each job runs pacman -Syu before use.
  ARCH_IMAGE: archlinux/archlinux:base-devel@sha256:a3c048d95acbbf5acc15a9e9a727d3cae2ba2ac69aa8b24d8ccd4f60b3102f28

jobs:
  build:
    name: Build .pkg.tar.zst
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: archlinux/archlinux:base-devel@sha256:a3c048d95acbbf5acc15a9e9a727d3cae2ba2ac69aa8b24d8ccd4f60b3102f28
    steps:
      - name: Provision build environment
        run: pacman -Syu --noconfirm --needed git cmake boost boost-libs namcap

      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare PKGBUILD for this commit
        id: prep
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          commit=$(git rev-parse HEAD)
          [[ $commit == "$GITHUB_SHA" ]] || { echo "checkout $commit is not $GITHUB_SHA"; exit 1; }

          pkgver=$(sed -n 's/^set(VERSION "\(.*\)")$/\1/p' CMakeLists.txt)
          tag=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          if [[ $tag =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            pkgver=${BASH_REMATCH[1]}
          fi
          stamp=$(date -u +%Y%m%d%H%M)
          pkgrel=0.$stamp

          useradd -m builder
          work=/home/builder/pkg
          mkdir -p "$work"
          cp package/arch/PKGBUILD "$work/"
          git bundle create "$work/conceal-core.bundle" HEAD
          sum=$(sha256sum "$work/conceal-core.bundle" | cut -d' ' -f1)
          sed -i \
            -e "s/^pkgver=.*/pkgver=$pkgver/" \
            -e "s/^pkgrel=.*/pkgrel=$pkgrel/" \
            -e "s/^_commit=.*/_commit=$commit/" \
            -e "s/^sha256sums=.*/sha256sums=('$sum')/" \
            "$work/PKGBUILD"
          chown -R builder: "$work"

          bash -n "$work/PKGBUILD"
          bash -n package/test-install.sh
          cat "$work/PKGBUILD"

          {
            echo "commit=$commit"
            echo "pkgver=$pkgver"
            echo "pkgrel=$pkgrel"
            echo "upgrade_pkgrel=0.$((stamp + 1))"
            echo "work=$work"
          } >> "$GITHUB_OUTPUT"

      - name: Build package as unprivileged user
        working-directory: ${{ steps.prep.outputs.work }}
        run: su builder -c 'makepkg --noconfirm --log'

      - name: Check package
        working-directory: ${{ steps.prep.outputs.work }}
        run: |
          set -euo pipefail
          pkg=$(ls conceal-core-*.pkg.tar.zst)
          namcap PKGBUILD | tee namcap.txt
          namcap -i "$pkg" | tee -a namcap.txt
          pacman -Qip "$pkg"
          pacman -Qlp "$pkg" | tee contents.txt
          for bin in conceald concealwallet walletd optimizer; do
            bsdtar -tvf "$pkg" "usr/bin/$bin" | grep -q '^-rwxr-xr-x' || { echo "usr/bin/$bin missing or not 755"; exit 1; }
            ldd "src/build/src/$bin" | sed "s|^|$bin: |"
          done | tee ldd.txt
          for f in LICENSE LICENSE.miniupnpc LICENSE.parallel_hashmap; do
            grep -q "/usr/share/licenses/conceal-core/$f\$" contents.txt || { echo "license $f missing"; exit 1; }
          done

      - name: Repackage at a higher pkgrel for the upgrade test
        working-directory: ${{ steps.prep.outputs.work }}
        run: |
          set -euo pipefail
          mkdir -p upgrade
          cp PKGBUILD PKGBUILD.built
          sed -i "s/^pkgrel=.*/pkgrel=${{ steps.prep.outputs.upgrade_pkgrel }}/" PKGBUILD
          su builder -c 'makepkg --noconfirm --repackage --nocheck --skipinteg'
          mv conceal-core-*-${{ steps.prep.outputs.upgrade_pkgrel }}-x86_64.pkg.tar.zst upgrade/
          mv PKGBUILD.built PKGBUILD

      - name: Write SHA256SUMS and build-info.txt
        working-directory: ${{ steps.prep.outputs.work }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist" "$GITHUB_WORKSPACE/upgrade"
          pkg=$(ls conceal-core-*.pkg.tar.zst)
          sha256sum "$pkg" > SHA256SUMS
          cat > build-info.txt <<EOF
          package: $pkg
          upstream commit: ${{ steps.prep.outputs.commit }}
          pkgver: ${{ steps.prep.outputs.pkgver }}
          pkgrel: ${{ steps.prep.outputs.pkgrel }}
          architecture: x86_64
          build date (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')
          workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          build environment: ${ARCH_IMAGE} after pacman -Syu (isolated container, not a devtools clean chroot)
          compiler: $(gcc --version | head -1)
          cmake: $(cmake --version | head -1)
          boost: $(pacman -Q boost)
          pacman: $(pacman -Q pacman)
          namcap: $(pacman -Q namcap)
          CPU target: -DARCH=x86-64 (generic x86-64), AES-NI required (-maes, NO_AES off)
          linking: -DSTATIC=OFF (shared Boost, libstdc++, glibc; in-tree libraries and miniupnpc static)
          compile flags: $(sed -n 's/^CXX_FLAGS = //p' src/build/src/CMakeFiles/Daemon.dir/flags.make)
          EOF
          cat build-info.txt SHA256SUMS
          cp "$pkg" SHA256SUMS build-info.txt namcap.txt ldd.txt contents.txt "$GITHUB_WORKSPACE/dist/"
          cp upgrade/*.pkg.tar.zst "$GITHUB_WORKSPACE/upgrade/"

      - name: Collect logs
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/logs"
          cp /home/builder/pkg/*.log /home/builder/pkg/*.txt "$GITHUB_WORKSPACE/logs/" 2>/dev/null || true

      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: conceal-core-arch-x86_64
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: conceal-core-arch-upgrade-test
          path: upgrade/
          retention-days: 3
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: conceal-core-arch-build-logs
          path: logs/
          if-no-files-found: warn

  test:
    name: Install, upgrade, remove in a clean container
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # archlinux/archlinux:base, digest pulled 2026-10-29. base-devel would not
    # work here: its gdb already pulls in boost-libs, which hides whether the
    # package declares Boost as a dependency.
    container:
      image: archlinux/archlinux:base@sha256:e4954feb61c332472f9cbf0e797a23be64434cf71db429349976192b4de782fc
    steps:
      - name: Update base image
        run: pacman -Syu --noconfirm --needed git

      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: conceal-core-arch-x86_64
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: conceal-core-arch-upgrade-test
          path: upgrade

      - name: Verify SHA256SUMS
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      - name: Install, upgrade, remove, smoke test
        run: |
          set -o pipefail
          mkdir -p logs
          bash package/test-install.sh dist/conceal-core-*.pkg.tar.zst upgrade/conceal-core-*.pkg.tar.zst "$GITHUB_SHA" 2>&1 | tee logs/test-install.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: conceal-core-arch-test-logs
          path: logs/
          if-no-files-found: warn
